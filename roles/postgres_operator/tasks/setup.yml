---
- name: "Create Postgres Operator namespace"
  kubernetes.core.k8s:
    name: "{{ postgres_operator_namespace }}"
    api_version: "v1"
    kind: "Namespace"
    state: "present"
  tags:
    - "namespace"

- name: "Add Postgres Operator Helm repository"
  kubernetes.core.helm_repository:
    name: "{{ postgres_operator_helm_repo_name }}"
    repo_url: "{{ postgres_operator_helm_repo_url }}"
    state: "present"
  tags:
    - "helm_repository"

- name: "Get currently installed Postgres Operator release"
  kubernetes.core.helm_info:
    name: "{{ postgres_operator_deployment_name }}"
    release_namespace: "{{ postgres_operator_namespace }}"
  register: "postgres_operator_current_release"

- name: "Upgrade CRDs for existing release before helm upgrade"
  ansible.builtin.include_tasks: "upgrade_crds.yml"
  when:
    - "postgres_operator_crds_upgrade_enabled"
    - "postgres_operator_current_release.status.chart is defined"
  tags:
    - "crds"

- name: "Install Postgres Operator"
  kubernetes.core.helm:
    name: "{{ postgres_operator_deployment_name }}"
    chart_ref: "{{ postgres_operator_helm_chart_ref }}"
    chart_version: "{{ postgres_operator_helm_chart_version }}"
    namespace: "{{ postgres_operator_namespace }}"
    values: "{{ lookup('ansible.builtin.template', 'postgres_operator_helm_values.yml.j2') | ansible.builtin.from_yaml }}"
    state: "present"
  tags:
    - "helm_chart"

- name: "Add Postgres Operator UI Helm repository"
  kubernetes.core.helm_repository:
    name: "{{ postgres_operator_ui_helm_repo_name }}"
    repo_url: "{{ postgres_operator_ui_helm_repo_url }}"
    state: "present"
  when: postgres_operator_ui_enabled
  tags:
    - "helm_repository"

- name: "Install Postgres Operator UI"
  kubernetes.core.helm:
    name: "{{ postgres_operator_ui_deployment_name }}"
    chart_ref: "{{ postgres_operator_ui_helm_chart_ref }}"
    chart_version: "{{ postgres_operator_ui_helm_chart_version }}"
    namespace: "{{ postgres_operator_namespace }}"
    values: "{{ lookup('ansible.builtin.template', 'postgres_operator_ui_helm_values.yml.j2') | ansible.builtin.from_yaml }}"
    state: "present"
  when: postgres_operator_ui_enabled
  tags:
    - "helm_chart"
