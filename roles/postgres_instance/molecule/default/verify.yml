---
- name: Verify
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: "Wait for 'postgres' namespace to be active."
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "postgres"
      register: namespace_postgres
      until:
        - namespace_postgres.resources | length > 0
        - namespace_postgres.resources[0].status.phase == "Active"
      retries: 30
      delay: 5

    - name: "Assert that 'postgres' namespace is active."
      ansible.builtin.assert:
        that:
          - namespace_postgres.resources | length > 0
          - namespace_postgres.resources[0].status.phase == "Active"
        fail_msg: "Namespace 'postgres' is not active."

    - name: "Wait for 'postgres-database' StatefulSet to be deployed."
      kubernetes.core.k8s_info:
        kind: "StatefulSet"
        name: "postgres-database"
        namespace: "postgres"
      register: stateful_set
      until: stateful_set.resources | length > 0
      retries: 30
      delay: 5

    - name: "Assert that 'postgres-database' StatefulSet is deployed."
      ansible.builtin.assert:
        that: stateful_set.resources | length > 0
        fail_msg: "StatefulSet 'postgres-database' is not deployed."

    - name: "Wait for the 'postgres-database' cluster to be running."
      kubernetes.core.k8s_info:
        api_version: "acid.zalan.do/v1"
        kind: "postgresql"
        name: "postgres-database"
        namespace: "postgres"
      register: postgresql_cluster
      until:
        - postgresql_cluster.resources | length > 0
        - postgresql_cluster.resources[0].status.PostgresClusterStatus | default("") == "Running"
      retries: 60
      delay: 5

    - name: "Assert that the 'postgres-database' cluster is running."
      ansible.builtin.assert:
        that:
          - postgresql_cluster.resources | length > 0
          - postgresql_cluster.resources[0].status.PostgresClusterStatus == "Running"
        fail_msg: "PostgreSQL cluster 'postgres-database' did not reach the Running state."

    - name: "Wait for every 'postgres-database' pod to be ready."
      kubernetes.core.k8s_info:
        kind: "StatefulSet"
        name: "postgres-database"
        namespace: "postgres"
      register: stateful_set_ready
      until:
        - stateful_set_ready.resources | length > 0
        - stateful_set_ready.resources[0].status.readyReplicas | default(0)
          == stateful_set_ready.resources[0].spec.replicas
      retries: 60
      delay: 5

    - name: "Assert that every 'postgres-database' pod is ready."
      ansible.builtin.assert:
        that:
          - stateful_set_ready.resources[0].status.readyReplicas | default(0)
            == stateful_set_ready.resources[0].spec.replicas
        fail_msg: "Not all 'postgres-database' pods are ready."
